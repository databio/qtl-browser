# Raw data sources for the TOPCHeF QTL browser.
# Consumed by data/raw/download.py. Edit this file to add or bump a source;
# the script never hard-codes a URL or version.
#
# Per file: `url` (or `file` combined with the source's `url_base`), optional
# `md5` (literal) or `md5_url` (fetch and read), optional `size` in bytes.
# Files are written to <dest>/<source dir>/<basename>.

dest: data/raw

sources:

