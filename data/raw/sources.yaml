      nominal.parquet. The record's other 48 files are PrediXcan prediction models (.db plus
      covariances, by training method x ancestry x SNP input) and are not QTL results; they are left
      out here.
    version: Zenodo record 15483845 (2026-06-01), concept DOI 10.5281/zenodo.15483844
    license: CC-BY-4.0
    dir: zenodo_15483845
    url_base: https://zenodo.org/api/records/15483845/files/{file}/content
