  - name: dbsnp
    description: dbSNP GRCh38 VCF with tabix index, for rsID lookup of chr:pos:A1:A2; assembly report maps RefSeq accessions (NC_000001.11) to chr names
    version: build 157 on GRCh38.p14 (NCBI latest_release as of 2026-09-03)
    dir: dbsnp_b157
